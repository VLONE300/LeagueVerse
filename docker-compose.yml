version: '3.8'

x-environment-variables: &default-env-vars
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  TELEGRAM_API_KEY: ${TELEGRAM_API_KEY}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
  HOCKEY_URL: ${HOCKEY_URL}
  BASKETBALL_URL: ${BASKETBALL_URL}

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    container_name: league_verse_app
    environment:
      <<: *default-env-vars
    volumes:
      - static_volume:/app/static/
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:8000/api/v1/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - app
    container_name: league_verse_bot
    environment:
      <<: *default-env-vars
    command: sh -c "python manage.py bot"
    restart: on-failure:5

  nginx:
    image: nginx:latest
    volumes:
      - ./conf/nginx.conf:/ets/nginx/nginx.conf
      - static_volume:/static
    ports:
      - "80:80"
    depends_on:
      - app

  redis:
    image: redis:latest
    ports:
      - "6381:6379"

  celery:
    build:
      context: .
    command: sh -c "sleep 10 && celery -A leagueverse worker -l info"
    depends_on:
      - redis
      - postgres
    stop_grace_period: 60s
    environment:
      <<: *default-env-vars

  celery-beat:
    build:
      context: .
    command: sh -c "sleep 10 && celery -A leagueverse beat -l info"
    depends_on:
      - celery
      - redis
      - postgres
    stop_grace_period: 60s
    environment:
      <<: *default-env-vars

volumes:
  pg_data:
  static_volume:
